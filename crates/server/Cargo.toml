[package]
name = "tokito-mcp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tokito MCP server — MCP (JSON-RPC) + REST faces over the shared symbol catalog"

[lib]
name = "tokito_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "tokito-mcp-server"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
postcard.workspace = true
tokito-symbols.workspace = true

[dependencies]
tokito-symbols.workspace = true
rusqlite.workspace = true

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

serde.workspace = true
serde_json.workspace = true

rmcp = { version = "1", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "0.8"
tokio-util = "0.7"

tracing.workspace = true
tracing-subscriber.workspace = true

anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
