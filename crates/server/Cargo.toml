[package]
name = "tokito-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tokito MCP server — MCP (JSON-RPC) + REST faces over the shared symbol catalog"

[lib]
name = "tokito_mcp_server"
path = "src/lib.rs"

[[bin]]
name = "tokito-mcp-server"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
bytes = "1"
postcard.workspace = true
tokito-symbols.workspace = true

[dependencies]
tokito-symbols.workspace = true
tokito-mcp-pack.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest.workspace = true

axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

serde.workspace = true
serde_json.workspace = true

# Reviewed upstream change modelcontextprotocol/rust-sdk#1474 makes Chrono
# optional. The exact revision keeps the dependency gate intact.
rmcp = { version = "=3.11.0", git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "9043cdfa8694d83bf506c2f3eb0313ec173edd7e", default-features = false, features = [
    "server",
    "macros",
    "transport-streamable-http-server",
    "schemars",
] }
schemars = "1.2"
tokio-util = "0.7"
futures = "0.3"

tracing.workspace = true
tracing-subscriber.workspace = true

anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
