name: release

# Trigger:
#   - Push a tag matching v*.*.* (e.g. v0.1.0) — full release.
#   - Manual workflow_dispatch — useful for re-running without bumping the tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      kicad_symbols_ref:
        description: 'gitlab.com/kicad/libraries/kicad-symbols git ref to build against'
        required: false
        default: '90c39c3880f0062a56b5944d428edc846968d72b'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Default kicad-symbols pin — bump when CERN ships an update we want to track.
  KICAD_SYMBOLS_REF: '90c39c3880f0062a56b5944d428edc846968d72b'

jobs:
  # ----------------------------------------------------------------- artifacts
  build-artifacts:
    name: Build symbols.sqlite + manifest + log
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      symbols_blake3: ${{ steps.meta.outputs.symbols_blake3 }}
    steps:
      - name: Checkout tokito-mcp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          KICAD_REF="${{ github.event.inputs.kicad_symbols_ref || env.KICAD_SYMBOLS_REF }}"
          echo "kicad_ref=${KICAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Verify package and release versions
        run: |
          args=()
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            args=(--release-tag "${GITHUB_REF_NAME}")
          fi
          python3 scripts/check-version.py "${args[@]}"

      - name: Cache cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Clone kicad-symbols at pinned ref
        run: |
          KICAD_REF='${{ steps.meta.outputs.kicad_ref }}'
          git clone --filter=blob:none https://gitlab.com/kicad/libraries/kicad-symbols.git
          (cd kicad-symbols && git checkout "$KICAD_REF")
          echo "Checked out kicad-symbols @ $(cd kicad-symbols && git rev-parse HEAD)"

      - name: Build packer
        run: cargo build --release -p tokito-mcp-pack

      - name: Run packer
        run: |
          mkdir -p out
          ./target/release/tokito-mcp-pack \
            --src kicad-symbols \
            --out out/symbols.sqlite \
            --source-commit '${{ steps.meta.outputs.kicad_ref }}'

      - name: Record blake3 of full artifact
        id: hash
        run: |
          BLAKE=$(jq -r '.artifacts[] | select(.name=="symbols.sqlite") | .blake3' out/manifest.json)
          echo "symbols_blake3=$BLAKE" >> "$GITHUB_OUTPUT"
          echo "symbols_blake3=$BLAKE" >> "$GITHUB_ENV"

      - name: Show build.log
        run: cat out/build.log

      - name: Upload artifacts (intra-workflow)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokito-mcp-artifacts
          path: |
            out/symbols.sqlite
            out/manifest.json
            out/build.log

  # ----------------------------------------------------------------- server
  build-server:
    name: Build tokito-mcp-server (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release -p tokito-mcp-server

      - name: Strip binary
        run: strip target/release/tokito-mcp-server

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tokito-mcp-server-linux-x86_64
          path: target/release/tokito-mcp-server

  # ----------------------------------------------------------------- docker
  docker:
    name: Build + push Docker image
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tokito-mcp-artifacts
          path: out

      - name: Stage artifact for docker build context
        run: cp out/symbols.sqlite ./symbols.sqlite

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          REPO=ghcr.io/${{ github.repository_owner }}/tokito-mcp
          REPO=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          VERSION='${{ needs.build-artifacts.outputs.version }}'
          {
            echo "image=${REPO}"
            echo "tags<<EOF"
            echo "${REPO}:${VERSION}"
            echo "${REPO}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            SYMBOLS_BLAKE3=${{ needs.build-artifacts.outputs.symbols_blake3 }}
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build-artifacts.outputs.version }}

      - name: Attest immutable container provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ----------------------------------------------------------------- release
  release:
    name: Create GitHub Release
    needs: [build-artifacts, build-server, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download symbol artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tokito-mcp-artifacts
          path: dist

      - name: Download server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tokito-mcp-server-linux-x86_64
          path: dist-server

      - name: Stage release files
        run: |
          mkdir -p release
          cp dist/symbols.sqlite     release/symbols.sqlite
          cp dist/manifest.json      release/manifest.json
          cp dist/build.log          release/build.log
          cp dist-server/tokito-mcp-server release/tokito-mcp-server-linux-x86_64
          (cd release && sha256sum * > SHA256SUMS)

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/symbols.sqlite
            release/manifest.json
            release/build.log
            release/tokito-mcp-server-linux-x86_64
            release/SHA256SUMS

      - name: Create / update release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          name: ${{ needs.build-artifacts.outputs.version }}
          generate_release_notes: true
          body: |
            ## tokito-mcp ${{ needs.build-artifacts.outputs.version }}

            ### Artifacts
            - `symbols.sqlite` — the catalog: symbol bodies + FTS index (~26 MB)
            - `manifest.json` — versions, counts, blake3 checksums
            - `build.log`     — top libs, dangling extends, sizes
            - `tokito-mcp-server-linux-x86_64` — pre-built server binary

            ### Docker
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/tokito-mcp:${{ needs.build-artifacts.outputs.version }}
            ```

            Publishing this image does not deploy production. Follow
            [`docs/deployment.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/deployment.md)
            and complete the external MCP protocol smoke test before declaring
            `https://mcp.tokito.dev/mcp` updated.

            ### symbols.sqlite blake3
            `${{ needs.build-artifacts.outputs.symbols_blake3 }}`
