name: public edge smoke

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-edge-smoke
  cancel-in-progress: false

jobs:
  production-mcp:
    name: production MCP protocol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve latest immutable release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Exercise public REST and stateful MCP boundary
        env:
          TOKITO_MCP_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          TOKITO_MCP_USER_AGENT: tokito/production-edge-smoke
        run: bash scripts/protocol-smoke.sh https://mcp.tokito.dev/mcp
