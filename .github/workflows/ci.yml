name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1

  version:
    name: package + advertised version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: python3 scripts/check-version.py

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --workspace --all-targets

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --workspace

  docker:
    name: Docker health + MCP smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate production control-plane overlay
        run: |
          docker compose \
            --env-file deploy/production/.env.example \
            -f deploy/production/compose.yml \
            -f deploy/production/compose.generated.yml \
            config --quiet

      - name: Download the latest released catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern symbols.sqlite

      - name: Install catalog integrity tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends b3sum

      - name: Build runtime image
        run: |
          catalog_blake3="$(b3sum symbols.sqlite | cut -d' ' -f1)"
          docker build \
            --build-arg "SYMBOLS_BLAKE3=${catalog_blake3}" \
            --tag tokito-mcp:ci .
          if docker build \
            --target catalog-validator \
            --build-arg "SYMBOLS_BLAKE3=$(printf '0%.0s' {1..64})" \
            .; then
            echo "catalog validation accepted an incorrect BLAKE3" >&2
            exit 1
          fi

      - name: Validate image health and protocol
        run: |
          export TOKITO_MCP_EXPECTED_VERSION="$(
            python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])'
          )"
          container="$(
            docker run --detach \
              --publish 127.0.0.1:8090:8090 \
              --health-interval 2s \
              --health-start-period 1s \
              --env TOKITO_MCP_ALLOWED_HOSTS=localhost,localhost:8090,127.0.0.1,127.0.0.1:8090 \
              tokito-mcp:ci
          )"
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            [[ "$status" == "healthy" ]] && break
            [[ "$status" == "unhealthy" ]] && exit 1
            sleep 2
          done
          [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" == "healthy" ]]
          bash scripts/protocol-smoke.sh http://127.0.0.1:8090/mcp
