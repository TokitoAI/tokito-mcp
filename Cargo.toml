[workspace]
resolver = "2"
members = [
    "crates/symbols",
    "crates/server",
    "crates/pack",
]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/TokitoAI/tokito-mcp"
homepage = "https://github.com/TokitoAI/tokito-mcp"

[workspace.dependencies]
# Shared crate
tokito-symbols = { version = "=0.1.5", path = "crates/symbols" }

# SQLite (bundled — no system dep)
rusqlite = { version = "0.32", features = ["bundled", "blob", "load_extension"] }

# Serde + body encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }

# HTTP + MCP server
axum = { version = "0.7", features = ["macros", "json"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.5", features = ["cors", "limit", "timeout", "trace"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# Hashing + checksums
blake3 = "1"
sha2 = "0.10"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Unicode normalization — used by tokito-symbols::part_id to build the
# canonical manufacturer key for the generated-symbol lookup.
unicode-normalization = "0.1"

# Packer-only
clap = { version = "4", features = ["derive", "env"] }
walkdir = "2"
rayon = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
